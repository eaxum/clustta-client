version: '3'

includes:
  common: ../Taskfile.yml

vars:
  MACOS_DEPLOYMENT_TARGET: '{{.MACOS_DEPLOYMENT_TARGET | default "15.0"}}'
  MAX_MACOS_SDK_VERSION: '{{.MAX_MACOS_SDK_VERSION | default "15.4"}}'
  MACOS_SDK_PATH: '{{.MACOS_SDK_PATH | default "/Library/Developer/CommandLineTools/SDKs/MacOSX15.sdk"}}'
  APP_VERSION: "0.4.39"

tasks:
  verify:sdk:
    summary: Verifies the selected Xcode macOS SDK is compatible with supported macOS releases
    cmds:
      - build/darwin/verify-sdk.sh "{{.MAX_MACOS_SDK_VERSION}}" "{{.MACOS_SDK_PATH}}"

  build:
    summary: Creates a production build of the application
    deps:
      - task: verify:sdk
      - task: common:go:mod:tidy
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.OUTPUT}}
    vars:
      # BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s"{{else}}-buildvcs=false -ldflags="-X clustta/internal/constants.host=http://127.0.0.1:5000" -gcflags=all="-l"{{end}}'
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -X clustta/internal/constants.version={{.APP_VERSION}}"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min={{.MACOS_DEPLOYMENT_TARGET}}"
      CGO_LDFLAGS: "-mmacosx-version-min={{.MACOS_DEPLOYMENT_TARGET}}"
      MACOSX_DEPLOYMENT_TARGET: "{{.MACOS_DEPLOYMENT_TARGET}}"
      SDKROOT: "{{.MACOS_SDK_PATH}}"
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  package:universal:
    summary: Packages a production build of the application into a `.app` bundle
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - task: create:app:bundle

  package:
    summary: Packages darwin universal binary (arm64 + amd64)
    deps:
      - task: build:universal
    cmds:
      - task: create:app:bundle


  create:app:bundle:
    summary: Creates an `.app` bundle
    cmds:
      - rm -rf {{.BIN_DIR}}/{{.APP_NAME}}.app
      - mkdir -p {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/{MacOS,Resources}
      - cp build/darwin/icons.icns {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources
      - cp build/darwin/appicon.icns {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/Resources
      - cp {{.BIN_DIR}}/{{.APP_NAME}} {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS
      - cp build/darwin/Info.plist {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents
      - vtool -show-build {{.BIN_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
