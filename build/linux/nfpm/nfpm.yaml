# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "clustta"
arch: ${GOARCH}
platform: "linux"
version: 0.4.34
section: "default"
priority: "extra"
maintainer: "Eaxum <support@clustta.com>"
description: "Clustta simplifies file management, collaboration and version control for creative workflows."
vendor: "Eaxum"
homepage: "https://clustta.com"
license: "AGPL-3.0-or-later"
release: "1"

contents:
  - src: "./bin/clustta"
    dst: "/usr/local/bin/clustta"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/256x256/apps/clustta.png"
  - src: "./build/linux/clustta.desktop"
    dst: "/usr/share/applications/clustta.desktop"
  - src: "./build/linux/clustta-clst.xml"
    dst: "/usr/share/mime/packages/clustta-clst.xml"
  - src: "./build/linux/clustta.metainfo.xml"
    dst: "/usr/share/metainfo/clustta.metainfo.xml"

# Default dependencies for Debian 12/Ubuntu 22.04+ with WebKit 4.1
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

# Distribution-specific overrides for different package formats and WebKit versions
overrides:
  # RPM packages for RHEL/CentOS/AlmaLinux/Rocky Linux (WebKit 4.0)
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
  
  # Arch Linux packages (WebKit 4.1)  
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"
