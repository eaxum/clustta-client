version: '3'

includes:
  common: ../Taskfile.yml

vars:
  APP_VERSION:
    sh: grep '^\s\+version:' ./build/config.yml | grep -oP '"\K[^"]+' | head -1

tasks:
  build:
    summary: Builds the application for Linux
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
      - task: common:generate:icons
    cmds:
      - go build {{.BUILD_FLAGS}} -o {{.BIN_DIR}}/{{.APP_NAME}}
    vars:
      BUILD_FLAGS: '{{if eq .PRODUCTION "true"}}-tags production -trimpath -buildvcs=false -ldflags="-w -s"{{else}}-buildvcs=false -gcflags=all="-l"{{end}}'
    env:
      GOOS: linux
      CGO_ENABLED: 1
      GOARCH: '{{.ARCH | default ARCH}}'
      PRODUCTION: '{{.PRODUCTION | default "false"}}'

  package:
    summary: Packages a production build of the application for Linux
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - task: create:deb
      - task: create:rpm

  create:deb:
    summary: Creates a deb package
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - task: generate:dotdesktop
      - task: generate:deb

  create:rpm:
    summary: Creates a rpm package
    deps:
      - task: build
        vars:
          PRODUCTION: "true"
    cmds:
      - task: generate:dotdesktop
      - task: generate:rpm

  generate:deb:
    summary: Creates a deb package
    cmds:
      - "sed -i 's/^version:.*/version: {{.APP_VERSION}}/' ./build/linux/nfpm/nfpm.yaml"
      - wails3 tool package -name {{.APP_NAME}} -format deb -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin
      - mv {{.ROOT_DIR}}/bin/{{.APP_NAME}}.deb {{.ROOT_DIR}}/bin/{{.APP_NAME}}-{{.APP_VERSION}}-linux-amd64.deb

  generate:rpm:
    summary: Creates a rpm package
    cmds:
      - "sed -i 's/^version:.*/version: {{.APP_VERSION}}/' ./build/linux/nfpm/nfpm.yaml"
      - wails3 tool package -name {{.APP_NAME}} -format rpm -config ./build/linux/nfpm/nfpm.yaml -out {{.ROOT_DIR}}/bin
      - mv {{.ROOT_DIR}}/bin/{{.APP_NAME}}.rpm {{.ROOT_DIR}}/bin/{{.APP_NAME}}-{{.APP_VERSION}}-linux-amd64.rpm

  generate:dotdesktop:
    summary: Generates a `.desktop` file
    dir: build
    cmds:
      - wails3 generate .desktop -name "{{.APP_NAME}}" -exec "{{.EXEC}}" -icon "{{.ICON}}" -outputfile {{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop -categories "{{.CATEGORIES}}" -mimetype "{{.MIMETYPE}}"
      - echo 'StartupWMClass={{.APP_NAME}}' >> {{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop
    vars:
      APP_NAME: '{{.APP_NAME}}'
      EXEC: '{{.APP_NAME}}'
      ICON: 'clustta'
      CATEGORIES: 'Development;'
      MIMETYPE: 'application/x-clustta-project;'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
