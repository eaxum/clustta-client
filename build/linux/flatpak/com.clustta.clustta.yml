app-id: com.clustta.clustta
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: clustta

finish-args:
  # Display
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU acceleration for WebKitGTK
  - --device=dri
  # Network access for sync and collaboration
  - --share=network
  # Access to user files for managing project assets
  - --filesystem=home
  # Keyring access for authentication tokens
  - --talk-name=org.freedesktop.secrets
  # Desktop notifications
  - --talk-name=org.freedesktop.Notifications
  # File chooser portal
  - --talk-name=org.freedesktop.portal.FileChooser
  # Wails single instance lock
  - --own-name=org.wails_app_com_clustta_clustta_single_instance.SingleInstance
  # System tray icon
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.kde.*

modules:
  - name: clustta
    buildsystem: simple
    build-commands:
      - install -Dm755 clustta -t /app/bin/
      - install -Dm644 com.clustta.clustta.desktop -t /app/share/applications/
      - install -Dm644 com.clustta.clustta.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 appicon-256.png /app/share/icons/hicolor/256x256/apps/com.clustta.clustta.png
      - install -Dm644 clustta-clst.xml /app/share/mime/packages/com.clustta.clustta-clst.xml
    sources:
      - type: file
        path: ../../../bin/clustta
      - type: file
        path: com.clustta.clustta.desktop
      - type: file
        path: ../clustta.metainfo.xml
        dest-filename: com.clustta.clustta.metainfo.xml
      - type: file
        path: appicon-256.png
      - type: file
        path: ../clustta-clst.xml
