<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/clustta.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clustta · Collaboration for Artists</title>
    <style>
      /* Initial loading screen styles - inlined for instant display */
      /* Uses z-index: 1 so app content naturally renders on top when ready */
      #app-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: hsl(254, 0%, 85%); 
        z-index: -1;
      }

      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        #app-loader {
          background-color: hsl(254, 0%, 15%);
        }
      }

      #app-loader .loader-logo {
        width: 80px;
        height: 80px;
        margin-bottom: 32px;
      }

      #app-loader .loader-progress-container {
        width: 200px;
        height: 4px;
        background-color: rgba(0, 0, 0, 0.1);
        border-radius: 4px;
        overflow: hidden;
        position: relative;
      }

      @media (prefers-color-scheme: dark) {
        #app-loader .loader-progress-container {
          background-color: rgba(255, 255, 255, 0.1);
        }
      }

      #app-loader .loader-progress-bar {
        position: absolute;
        top: 0;
        right: 100%;
        bottom: 0;
        left: 0;
        height: 100%;
        background: linear-gradient(to right, transparent, #643193, transparent);
        width: 0;
        animation: borealisBar 0.8s linear infinite;
      }

      @keyframes borealisBar {
        0% {
          left: 0%;
          right: 100%;
          width: 0%;
        }
        25% {
          left: 0%;
          right: 75%;
          width: 40%;
        }
        50% {
          left: 0%;
          right: 50%;
          width: 90%;
        }
        75% {
          right: 0%;
          left: 75%;
          width: 40%;
        }
        100% {
          left: 100%;
          right: 0%;
          width: 0%;
        }
      }

      #app-loader .loader-status {
        margin-top: 16px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        font-size: 14px;
        color: rgba(0, 0, 0, 0.5);
        animation: pulse 1.5s ease-in-out infinite;
      }

      @media (prefers-color-scheme: dark) {
        #app-loader .loader-status {
          color: rgba(255, 255, 255, 0.5);
        }
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.9; }
      }

    </style>
  </head>

  <body>
    <!-- Loading screen shown before Vue mounts -->
    <div id="app-loader">
      <img src="/icons/clustta.png" alt="Clustta" class="loader-logo" />
      <div class="loader-progress-container">
        <div class="loader-progress-bar"></div>
      </div>
      <div id="loader-status" class="loader-status"></div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
